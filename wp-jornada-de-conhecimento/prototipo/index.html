<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada de Conhecimento — protótipo</title>
<style>
/*
VOICE: institucional GTI, claro e calmo; produto pronto, não apresentação.
IDEA: um percurso de aprendizagem — cada jornada é um caminho com etapas marcadas.
PICTURE: hero "Continue de onde parou" com o caminho de etapas desenhado e o anel de progresso.
COLOUR and TYPE: tokens GTI (azul #164b78, petróleo #163e5f, acento #258783) sobre #f5f7fa; Aptos/Segoe UI.
LAYOUT: casca do site (ex-layout-sharepoint) com barra superior e lateral; a web part ocupa a área de trabalho.
*/
:root{color-scheme:light;--pi-blue:#164b78;--pi-navy:#112f49;--pi-accent:#258783;--pi-ink:#25374b;--pi-muted:#718093;--pi-border:#e5eaf0;--pi-bg:#f5f7fa;--pi-surface:#fff;--pi-soft:#edf4fa;--pi-hover:#f0f4f8;--pi-hero:#163e5f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--pi-bg);color:var(--pi-ink);font:14px/1.5 "Aptos","Segoe UI",Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{color:var(--pi-navy)}
a{color:var(--pi-blue)}
:focus-visible{outline:3px solid #58a8d8;outline-offset:3px}
.wp:focus,#h1:focus,#etapaTit:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{flex:none}
/* ---------- casca do site (ex-layout-sharepoint) ---------- */
/* ---------- controles do protótipo (fora da web part) ---------- */
.protobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 24px;background:#fffaf0;border-bottom:1px dashed #e8cf98;font-size:12px;color:#7a5a1e}
.protobar b{font-size:10px;font-weight:750;letter-spacing:1.2px;padding:3px 8px;border-radius:5px;background:#fff1d4;color:#ae7d2e}
.protobar label{display:flex;align-items:center;gap:8px;margin-left:auto}
.protobar select{min-height:30px;border:1px solid #e8cf98;border-radius:6px;background:#fff;padding:0 8px;font-size:12px;color:var(--pi-navy);font-weight:600}
.sitezone{margin:18px 36px 0;padding:12px 16px;border:1px dashed #c9d4df;border-radius:10px;color:var(--pi-muted);font-size:12px;display:flex;align-items:center;gap:10px;background:#fff}
/* ---------- navegação interna da web part ---------- */
.wpbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;min-height:60px;padding:8px 12px;margin-bottom:26px;background:#ffffffef;backdrop-filter:blur(8px);border:1px solid var(--pi-border);border-radius:12px;box-shadow:0 2px 3px #102c4908}
.wpbrand{display:flex;align-items:center;gap:11px;flex:none}
.wpbrand .mk{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pi-blue),var(--pi-accent));color:#fff}
.wpbrand b{display:block;font-size:14px;font-weight:650;color:var(--pi-navy);line-height:1.2;white-space:nowrap}
.wpbrand small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--pi-muted)}
.env{font-size:9px;font-weight:750;letter-spacing:1px;padding:2px 6px;border-radius:4px;background:#edf3f9;color:#5b7b9a}
.wptabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-left:14px;border-left:1px solid var(--pi-border)}
.wptabs::-webkit-scrollbar{display:none}
.wptab{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border-radius:8px;color:#637085;text-decoration:none;font-size:13px;white-space:nowrap;flex:none}
.wptab:hover{background:var(--pi-hover);color:var(--pi-blue)}
.wptab[aria-current=page]{background:var(--pi-soft);color:var(--pi-blue);font-weight:700}
.wptab[aria-current=page]::after{content:"";position:absolute;left:12px;right:12px;bottom:-9px;height:3px;border-radius:2px 2px 0 0;background:var(--pi-blue)}
.wptab .count{min-width:18px;padding:1px 6px;border-radius:9px;background:#fff7e7;color:#ae7d2e;font-size:10px;font-weight:700;text-align:center}
.wpsep{width:1px;height:22px;background:var(--pi-border);flex:none;margin:0 4px}
.wptools{display:flex;align-items:center;gap:10px;flex:none}
.search-trigger{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px 0 12px;border:1px solid var(--pi-border);border-radius:8px;background:var(--pi-bg);color:var(--pi-muted);font-size:12px}
.search-trigger kbd{font:10px "Segoe UI",sans-serif;padding:1px 5px;border:1px solid var(--pi-border);border-radius:4px;background:#fff}
.me{display:flex;align-items:center;gap:9px}
.me b{display:block;font-size:12px;font-weight:650;color:var(--pi-navy);line-height:1.2;white-space:nowrap}
.me small{font-size:11px;color:var(--pi-muted);white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pi-soft);color:var(--pi-blue);font-weight:650;font-size:12px;flex:none}
/* ---------- web part ---------- */
.wp{flex:1;min-width:0;padding:30px 36px 26px}
.wp-inner{max-width:1320px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{display:block;font-size:9px;font-weight:750;letter-spacing:1.8px;color:var(--pi-muted);margin-bottom:7px;text-transform:uppercase}
.page-head h1{font-size:29px;font-weight:650;line-height:1.25;letter-spacing:-.8px}
.page-head p{margin-top:7px;font-size:13px;color:var(--pi-muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;border:1px solid #dce3ea;border-radius:7px;padding:8px 13px;background:#fff;color:#526577;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c4d0dc;color:var(--pi-blue)}
.btn.primary{background:var(--pi-blue);border-color:var(--pi-blue);color:#fff}
.btn.primary:hover{background:#103c64}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:#b35a65}
.btn.light{background:#ffffff1a;border-color:#ffffff40;color:#fff}
.btn.light:hover{background:#ffffff2e;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.lg{min-height:42px;padding:10px 18px;font-size:13px}
.card{border:1px solid var(--pi-border);border-radius:10px;background:#fff;box-shadow:0 2px 3px #102c4908}
.panel{padding:22px 23px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.panel-head h2{font-size:16px;font-weight:650}
.panel-head p{font-size:12px;color:var(--pi-muted);margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px;flex-wrap:wrap}
.section-title h2{font-size:19px;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.metrics.m5{grid-template-columns:repeat(5,minmax(0,1fr))}
.metric{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.metric .top{display:flex;justify-content:space-between;color:var(--pi-muted);font-size:12px}
.metric strong{font-size:30px;line-height:1.2;color:var(--pi-navy);font-weight:600}
.metric small{font-size:11px;color:var(--pi-muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:22px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 7px;font-size:10px;font-weight:600;background:#edf3f9;color:#5b7b9a;white-space:nowrap}
.badge::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.badge.green{background:#edf7f1;color:#438268}.badge.amber{background:#fff7e7;color:#ae7d2e}.badge.red{background:#fceff0;color:#b35a65}.badge.plain::before{display:none}
.muted{color:var(--pi-muted)}
.small{font-size:12px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:13px;background:linear-gradient(120deg,#123552 0%,#163e5f 45%,#1b6a80 100%);color:#fff;padding:30px 34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;min-height:236px;margin-bottom:22px}
.hero h2{color:#fff;font-size:27px;font-weight:650;letter-spacing:-.4px;line-height:1.2}
.hero p{color:#bbcedd;font-size:13px;margin-top:8px}
.hero .eyebrow{color:#8fb3cd}
.hero-path{position:absolute;inset:auto 0 0 0;height:100%;pointer-events:none;opacity:.55}
.hero-body{position:relative;display:flex;flex-direction:column;gap:14px}
.hero-steps{display:flex;gap:6px;flex-wrap:wrap}
.hero-steps span{height:6px;width:38px;border-radius:3px;background:#ffffff30}
.hero-steps span.done{background:#7fd1c7}.hero-steps span.now{background:#fff}
.hero-ring{position:relative;display:grid;place-items:center}
.hero-ring strong{position:absolute;font-size:26px;font-weight:650;color:#fff}
.hero-ring small{position:absolute;top:58%;font-size:10px;color:#bbcedd}
/* cards de jornada */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.jcard{display:flex;flex-direction:column;overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:box-shadow .15s,transform .15s}
.jcard:hover{box-shadow:0 8px 24px #102c4914;transform:translateY(-2px)}
.cover{position:relative;height:118px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;color:#fff;overflow:hidden}
.cover svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.cover .ci{position:relative;width:42px;height:42px;border-radius:10px;background:#ffffff26;display:grid;place-items:center}
.cover .tags{position:relative;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cover .tags span{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;background:#ffffffe6;color:var(--pi-navy)}
.cover .tags span.late{background:#fceff0;color:#b35a65}
.jbody{padding:14px 16px 6px;display:flex;flex-direction:column;gap:6px;flex:1}
.jarea{font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase}
.jbody h3{font-size:15px;font-weight:650;line-height:1.35}
.jmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--pi-muted)}
.jmeta span{display:inline-flex;align-items:center;gap:4px}
.jfoot{display:flex;align-items:center;gap:10px;padding:10px 16px 14px}
.bar{flex:1;height:6px;border-radius:3px;background:#e9eef3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--pi-accent)}
.jfoot b{font-size:11px;color:var(--pi-ink);min-width:34px;text-align:right}
.stars{display:inline-flex;align-items:center;gap:1px;color:#c9962f}
.stars em{font-style:normal;margin-left:4px;font-size:11px;color:var(--pi-muted)}
/* listas */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--pi-border)}
.row:last-child{border-bottom:0}
.row .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:13px;font-weight:600;color:var(--pi-navy)}
.row .txt span{font-size:12px;color:var(--pi-muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--pi-blue);font-size:12px;font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
/* filtros e tabela */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--pi-border);border-radius:7px;padding:0 11px;min-height:38px;background:#fff;flex:1 1 260px;color:var(--pi-muted)}
.search:focus-within{outline:3px solid #58a8d8;outline-offset:2px}
.search input{border:0;outline:0;background:transparent;width:100%;padding:8px 0;font-size:13px;color:var(--pi-ink)}
.select{min-height:38px;border:1px solid #dce4ec;border-radius:7px;padding:0 10px;background:#fff;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border:1px solid var(--pi-border);border-radius:16px;background:#fff;font-size:12px;color:#526577}
.chip[aria-pressed=true]{background:var(--pi-soft);border-color:#b9cfe3;color:var(--pi-blue);font-weight:650}
.chip i{width:8px;height:8px;border-radius:50%}
.seg{display:inline-flex;border:1px solid #dce3ea;border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 10px;color:var(--pi-muted);display:grid;place-items:center}
.seg button[aria-pressed=true]{background:var(--pi-soft);color:var(--pi-blue)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--pi-border);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 0 12px;font-size:13px;color:#637085;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--pi-blue);border-color:var(--pi-blue);font-weight:650}
.tab .count{margin-left:6px;padding:1px 6px;border-radius:9px;background:#fff7e7;color:#ae7d2e;font-size:10px;font-weight:700}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{background:#f8fafc;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:11px 16px;color:var(--pi-muted);white-space:nowrap}
td{font-size:12px;padding:13px 16px;border-bottom:1px solid var(--pi-border);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
/* empty / loading */
.empty{min-height:200px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--pi-muted)}
.empty h3{font-size:15px}
.empty p{font-size:12px;max-width:420px}
/* detalhe de jornada */
.jhero{border-radius:13px;color:#fff;padding:28px 32px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;margin-bottom:22px}
.jhero svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.2}
.jhero>*{position:relative}
.jhero h1{color:#fff;font-size:28px;font-weight:650;letter-spacing:-.5px;line-height:1.2;margin:6px 0 10px}
.jhero p{color:#d8e6f0;font-size:13px;max-width:640px}
.jhero .facts{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:#d8e6f0}
.jhero .facts span{display:inline-flex;align-items:center;gap:6px}
.jhero aside{background:#ffffff14;border:1px solid #ffffff26;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;align-self:start}
.jhero aside .bar{background:#ffffff30}.jhero aside .bar i{background:#7fd1c7}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--pi-border);align-items:center}
.step:last-child{border-bottom:0}
.step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none;background:#eef2f6;color:var(--pi-muted)}
.step.done .n{background:#edf7f1;color:#438268}
.step.now .n{background:var(--pi-blue);color:#fff}
.step .txt{flex:1;min-width:0}
.step .txt b{display:block;font-size:13px;font-weight:600;color:var(--pi-navy)}
.step .txt span{font-size:12px;color:var(--pi-muted);display:inline-flex;gap:6px;align-items:center}
/* player */
.player-top{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.player-top .t{flex:1;min-width:200px}
.player-top .t span{font-size:11px;color:var(--pi-muted)}
.player-top .t b{display:block;font-size:17px;color:var(--pi-navy);font-weight:650}
.player-top .prog{display:flex;align-items:center;gap:10px;min-width:220px}
.player{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.player.collapsed{grid-template-columns:minmax(0,1fr)}
.player.collapsed .timeline{display:none}
.timeline{position:sticky;top:96px;padding:16px 12px;max-height:calc(100vh - 120px);overflow:auto}
.timeline h2{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--pi-muted);padding:0 8px 10px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative}
.tl li:not(:last-child)::after{content:"";position:absolute;left:23px;top:42px;bottom:-6px;width:2px;background:#e9eef3}
.tl li.done:not(:last-child)::after{background:#b8dcc6}
.tl button{display:flex;gap:12px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;text-align:left;align-items:flex-start}
.tl button:hover:not([aria-disabled=true]){background:var(--pi-hover)}
.tl button[aria-current=step]{background:var(--pi-soft)}
.tl button[aria-disabled=true]{cursor:not-allowed;opacity:.6}
.tl .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:#eef2f6;color:var(--pi-muted);position:relative;z-index:1}
.tl li.done .dot{background:#edf7f1;color:#438268}
.tl button[aria-current=step] .dot{background:var(--pi-blue);color:#fff}
.tl .tx b{display:block;font-size:12px;font-weight:600;color:var(--pi-navy);line-height:1.35}
.tl .tx span{font-size:11px;color:var(--pi-muted)}
.stage{padding:0;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--pi-border);flex-wrap:wrap}
.stage-head h2{font-size:18px;font-weight:650}
.video{position:relative;aspect-ratio:16/9;background:#0e2233;display:grid;place-items:center;overflow:hidden}
.video .frame{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#1f5a78 0,#0e2233 60%)}
.video .frame svg{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.video .vtitle{position:absolute;left:22px;top:18px;color:#d8e6f0;font-size:12px}
.video .playbig{position:relative;width:76px;height:76px;border-radius:50%;border:0;background:#ffffffeb;color:var(--pi-blue);display:grid;place-items:center;box-shadow:0 10px 30px #0006}
.video .controls{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;display:flex;gap:12px;align-items:center;background:linear-gradient(transparent,#0009);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.video .controls button{border:0;background:none;color:#fff;display:grid;place-items:center}
.video .track{flex:1;height:5px;border-radius:3px;background:#ffffff40;position:relative;cursor:pointer}
.video .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#7fd1c7}
.video .track em{position:absolute;top:-4px;width:2px;height:13px;background:#fff7;border-radius:1px}
.resume{position:absolute;top:16px;right:16px;background:#ffffffeb;color:var(--pi-navy);font-size:12px;padding:6px 10px;border-radius:6px}
.doc{background:#eef2f6;padding:26px;display:grid;place-items:center}
.sheet{width:min(100%,620px);background:#fff;border-radius:4px;box-shadow:0 6px 20px #102c4914;padding:34px 40px;min-height:360px}
.sheet h3{font-size:18px;margin-bottom:12px}
.sheet .l{height:9px;border-radius:4px;background:#eef2f6;margin:10px 0}
.linkcard{padding:44px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:linear-gradient(180deg,#f8fafc,#fff)}
.linkcard .ico{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--pi-soft);color:var(--pi-blue)}
.stage-body{padding:18px 22px}
.stage-body .instr{font-size:13px;line-height:1.65;color:var(--pi-ink)}
.stage-body .instr ul{margin:8px 0 0;padding-left:20px}
.stage-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--pi-border);background:#fbfcfd}
.stage-foot .rule{font-size:12px;color:var(--pi-muted);display:inline-flex;gap:6px;align-items:center}
.like[aria-pressed=true]{background:var(--pi-soft);border-color:#b9cfe3;color:var(--pi-blue)}
.kbdhint{margin-left:auto;font-size:11px;color:var(--pi-muted)}
.kbdhint kbd{font:10px "Segoe UI";padding:1px 5px;border:1px solid var(--pi-border);border-radius:4px;background:#fff}
/* avaliações */
.rating-sum{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center}
.rating-sum .big{font-size:44px;font-weight:650;color:var(--pi-navy);line-height:1}
.dist{display:flex;flex-direction:column;gap:6px}

  inp.addEventListener('input', () => { const q = inp.value.trim().toLowerCase(); if (q.length < 3) { lista.style.display = 'none'; inp.setAttribute('aria-expanded', 'false'); return; }
    const r = DIRETORIO.filter(d => (d.nome + d.email).toLowerCase().includes(q)).slice(0, 6);
    lista.innerHTML = r.length ? r.map(d => `<li><button type="button" data-pick="${esc(inp.id)}" data-nome="${esc(d.nome)}" data-email="${esc(d.email)}"><span class="avatar" style="width:30px;height:30px;font-size:11px">${esc(d.nome.split(' ').map(s => s[0]).join(''))}</span><span><b>${esc(d.nome)}</b><span>${esc(d.email)}</span></span></button></li>`).join('') : '<li class="small muted" style="padding:10px">Nenhuma pessoa encontrada no diretório.</li>';
    lista.style.display = 'block'; inp.setAttribute('aria-expanded', 'true'); }); });

// ---------- paleta Ctrl+K ----------
const abrirPaleta = () => { const d = $('#palette'); d.innerHTML = `<div class="pal-in">${ic('search', 18)}<input id="palQ" placeholder="Buscar jornadas, etapas e telas" aria-label="Buscar" aria-controls="palL" autocomplete="off"><kbd style="font-size:10px;border:1px solid var(--pi-border);border-radius:4px;padding:1px 5px">Esc</kbd></div><ul class="pal-list" id="palL" role="listbox"></ul>`; d.showModal(); filtrarPaleta(''); $('#palQ').addEventListener('input', e => filtrarPaleta(e.target.value)); };
const filtrarPaleta = q => { q = q.toLowerCase(); const telas = NAV().flatMap(([, i]) => i).map(([h, t, ic2]) => ({g:'Telas', h, t, s:'Ir para', i:ic2}));
  const js = visiveis().map(j => ({g:'Jornadas', h:'jornada-' + j.id, t:j.titulo, s:`${areaDe(j.area).nome} · ${j.etapas.length} etapas · ${pctDe(j)}%`, i:'book'}));
  const es = visiveis().flatMap(j => j.etapas.map(e => ({g:'Etapas', h:'player-' + j.id, e:e.id, t:e.t, s:j.titulo, i:tipoIcone(e.tipo)})));
  S.paleta = [...telas, ...js, ...(q ? es : [])].filter(x => !q || (x.t + ' ' + x.s).toLowerCase().includes(q)).slice(0, 12); S.palIx = 0; desenharPaleta(); };
const desenharPaleta = () => { let g = ''; $('#palL').innerHTML = S.paleta.length ? S.paleta.map((x, k) => `${x.g !== g ? `<li class="pal-group">${(g = x.g)}</li>` : ''}<li><button role="option" aria-selected="${k === S.palIx}" data-pal="${k}">${ic(x.i, 18)}<span><b>${esc(x.t)}</b><span>${esc(x.s)}</span></span></button></li>`).join('') : '<li class="small muted" style="padding:14px">Nada encontrado.</li>'; };
const irPaleta = k => { const x = S.paleta[k]; if (!x) return; $('#palette').close(); if (x.e) S.etapaPedida = x.e; S.player = null; location.hash = '#' + x.h; };

// ---------- ligações por tela ----------
const ligar = () => {
  const q = $('#q'); if (q) q.addEventListener('input', () => { S.filtro.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  [['#fcat', 'cat'], ['#fsit', 'sit'], ['#ford', 'ord']].forEach(([s, k]) => { const el = $(s); if (el) el.addEventListener('change', () => { S.filtro[k] = el.value; render(); }); });
  const qm = $('#qMapa'); if (qm) qm.addEventListener('input', () => { S.qMapa = qm.value; const pos = qm.selectionStart; render(); const n = $('#qMapa'); n.focus(); n.setSelectionRange(pos, pos); });
  const se = $('#selEstudio'); if (se) se.addEventListener('change', () => { S.area.estudio = se.value; render(); });
  const sg = $('#selGestao'); if (sg) sg.addEventListener('change', () => { S.area.gestao = sg.value; render(); });
  document.querySelectorAll('[data-f]').forEach(el => el.addEventListener('input', () => { const k = el.dataset.f; S.editor.d[k] = el.type === 'number' ? Number(el.value || 0) : el.value; if (S.editor.erros[k]) { delete S.editor.erros[k]; } const prev = document.querySelector('.preview-col'); if (prev && k === 'titulo') prev.querySelector('h3').textContent = el.value || 'Nome da jornada'; }));
  const co = $('#coment'); if (co) co.addEventListener('input', () => { $('#cont').textContent = `${co.value.length}/1000`; });
  const tr = $('#track'); if (tr) { const pular = pct => { const j = jAtual(), e = etapaAtual(); registrarPos(j, e, pct); log('Matrícula', `Posição ajustada para ${Math.round(pct)}%`); render(); };
    tr.addEventListener('click', ev => { const r = tr.getBoundingClientRect(); pular((ev.clientX - r.left) / r.width * 100); });
    tr.addEventListener('keydown', ev => { const j = jAtual(), e = etapaAtual(), atual = progDe(j).pct[e.id] || 0; if (ev.key === 'ArrowRight') { ev.preventDefault(); pular(Math.min(100, atual + 5)); } if (ev.key === 'ArrowLeft') { ev.preventDefault(); pular(Math.max(0, atual - 5)); } }); }
  const el = $('#elist'); if (el) { let de = null; el.querySelectorAll('.eitem').forEach(li => {
    li.addEventListener('dragstart', () => { de = Number(li.dataset.ix); li.classList.add('dragging'); });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', ev => { ev.preventDefault(); li.classList.add('over'); });
    li.addEventListener('dragleave', () => li.classList.remove('over'));
    li.addEventListener('drop', ev => { ev.preventDefault(); const para = Number(li.dataset.ix); if (de === null || de === para) return; const lst = S.editor.d.etapas; const [x] = lst.splice(de, 1); lst.splice(para, 0, x); log('Estúdio', `Etapa movida de ${de + 1} para ${para + 1}`); render(); }); }); }
  ligarPickers(document);
};

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-go],[data-act],[data-area],[data-vis],[data-apr],[data-jtab],[data-etapa-go],[data-etapa],[data-passo],[data-publico],[data-tg],[data-nota],[data-nota-c],[data-tipo],[data-pick],[data-pal],[data-cor]'); if (!t) return;
  const ds = t.dataset;
  if (ds.go) { S.player = null; location.hash = '#' + ds.go; return; }
  if (ds.area) { S.area.catalogo = ds.area; render(); return; }
  if (ds.vis) { S.filtro.vis = ds.vis; render(); return; }
  if (ds.apr) { S.aprendizado = ds.apr; render(); return; }
  if (ds.jtab) { S.jtab = ds.jtab; S.nota = null; render(); return; }
  if (ds.etapaGo) { if (t.getAttribute('aria-disabled') === 'true' || t.disabled) return; pararVideo(); S.player.etapa = Number(ds.etapaGo); progDe(jAtual()).atual = S.player.etapa; log('Matrícula', `Etapa atual: ${ds.etapaGo}`); render(); $('#etapaTit')?.focus(); return; }
  if (ds.etapa && t.tagName === 'A') { S.player = null; S.etapaPedida = Number(ds.etapa); return; }
  if (ds.passo) { S.editor.passo = Number(ds.passo); render(); return; }
  if (ds.publico) { S.editor.d.publico = ds.publico; render(); return; }
  if (ds.tg) { S.editor.d[ds.tg] = !S.editor.d[ds.tg]; render(); return; }
  if (ds.nota) { S.nota = Number(ds.nota); render(); return; }
  if (ds.notaC) { S.nota = Number(ds.notaC); document.querySelectorAll('[data-nota-c]').forEach(b => { const k = Number(b.dataset.notaC); b.setAttribute('aria-checked', k === S.nota); b.querySelector('svg').setAttribute('fill', k <= S.nota ? 'currentColor' : 'none'); }); return; }
  if (ds.tipo) { lerEtapaForm(); const x = S.etapaForm; x.tipo = ds.tipo; if (!(ds.tipo === 'YouTube' || ds.tipo === 'Video') && x.regra === 'Percentual') x.regra = 'Abrir'; if ((ds.tipo === 'YouTube' || ds.tipo === 'Video') && x.regra === 'Abrir') x.regra = 'Percentual'; formEtapa(x, x.ix); return; }
  if (ds.cor) { S.areaForm.cor = ds.cor; t.parentElement.querySelectorAll('[data-cor]').forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
  if (ds.pal) { irPaleta(Number(ds.pal)); return; }
  if (ds.pick) { const alvo = ds.pick, p = {nome:ds.nome, email:ds.email};
    if (alvo === 'pubPicker') { if (!S.editor.d.pessoas.some(x => x.email === p.email)) S.editor.d.pessoas.push(p); render(); return; }
    if (alvo === 'areaGest') { S.areaForm.gestores.push(p); const inp = $('#areaGest'); inp.value = ''; inp.closest('.field').querySelector('.chips').insertAdjacentHTML('beforeend', `<span class="chip">${esc(p.nome)}</span>`); $('#areaGest-l').style.display = 'none'; return; }
    const g = alvo.replace('pk-', ''); if (!PESSOAS_GRUPOS[g].some(x => x.email === p.email)) { PESSOAS_GRUPOS[g].unshift(p); log('Grupos', `${p.nome} incluída em ${g}`); toast(`${p.nome} incluída no grupo. O acesso vale na hora.`); } render(); return; }
  switch (ds.act) {
    case 'limparFiltros': S.filtro = {q:'', cat:'', sit:'', ord:'relevancia', vis:S.filtro.vis}; S.area.catalogo = 'todas'; render(); break;
    case 'timeline': S.timeline = !S.timeline; render(); break;
    case 'play': tocar(); break;
    case 'concluir': concluirEtapa(); break;
    case 'abrirDoc': ev.preventDefault(); { const j = jAtual(), e = etapaAtual(), p = progDe(j); if (p.pct[e.id] === undefined) { p.pct[e.id] = 100; log('Matrícula', `Conteúdo aberto na etapa ${e.id}`); } toast('No SharePoint, o conteúdo abre em nova aba.'); render(); } break;
    case 'curtir': { S.curtidas = S.curtidas || {}; S.curtidas[ds.e] = !S.curtidas[ds.e]; log('Curtidas', `${S.curtidas[ds.e] ? 'Curtiu' : 'Descurtiu'} a etapa ${ds.e} (atualização otimista)`); render(); } break;
    case 'salvarNota': case 'salvarNotaC': { const j = JORNADAS.find(x => x.id === Number(ds.j)), lst = AVALIACOES[j.id], txt = ($(ds.act === 'salvarNotaC' ? '#comentC' : '#coment')?.value || '').trim(), minha = lst.find(x => x.nome === perfil().nome), nota = S.nota ?? minha?.nota;
      if (!nota) { toast('Escolha de 1 a 5 estrelas.'); break; } if (minha) Object.assign(minha, {nota, txt, data:'2026-11-27'}); else lst.unshift({nome:perfil().nome, nota, txt, data:'2026-11-27'}); S.nota = null; log('Avaliação', `Jornada ${j.id}: ${nota} estrela(s)`); if (ds.act === 'salvarNotaC') $('#center').close(); toast('Avaliação salva. Obrigado!'); render(); } break;
    case 'excluirNota': { const lst = AVALIACOES[Number(ds.j)]; lst.splice(lst.findIndex(x => x.nome === perfil().nome), 1); S.nota = null; toast('Sua avaliação foi excluída.'); render(); } break;
    case 'fecharCentro': $('#center').close(); render(); break;
    case 'fecharSide': fecharSide(); break;
    case 'passo': S.editor.passo = Math.max(0, Math.min(4, S.editor.passo + Number(ds.dir))); render(); $('section.panel[aria-label]')?.scrollIntoView({block:'nearest'}); break;
    case 'novaEtapa': formEtapa(E(-Date.now(), '', 'YouTube', 10)); break;
    case 'editarEtapa': formEtapa(S.editor.d.etapas[Number(ds.ix)], Number(ds.ix)); break;
    case 'aplicarEtapa': { lerEtapaForm(); const x = S.etapaForm; if (!x.t.trim()) { $('#eT').closest('.field').classList.add('invalid'); $('#eT').focus(); break; } const {ix, ...etapa} = x; const lst = S.editor.d.etapas; if (ix === undefined) lst.push(etapa); else lst[ix] = etapa; delete S.editor.erros.etapas; fecharSide(); render(); toast(ix === undefined ? 'Etapa adicionada.' : 'Etapa atualizada.'); } break;
    case 'mover': { const lst = S.editor.d.etapas, i = Number(ds.ix), k = i + Number(ds.dir); [lst[i], lst[k]] = [lst[k], lst[i]]; render(); document.querySelector(`[data-act=mover][data-ix="${k}"][data-dir="${ds.dir}"]`)?.focus(); } break;
    case 'removerEtapa': { const lst = S.editor.d.etapas, [x] = lst.splice(Number(ds.ix), 1); render(); toast(`"${x.t}" removida. Vai para a lixeira ao salvar.`); } break;
    case 'tirarPessoa': S.editor.d.pessoas.splice(Number(ds.ix), 1); render(); break;
    case 'salvarRascunho': salvarEditor(S.editor.d.status === 'Publicada' ? 'EmAprovacao' : 'Rascunho'); break;
    case 'enviar': salvarEditor('EmAprovacao'); break;
    case 'publicar': salvarEditor('Publicada'); break;
    case 'previa': previa(JORNADAS.find(j => j.id === Number(ds.j))); break;
    case 'previaEditor': previa({...S.editor.d, id:S.editor.d.id || 99, pub:S.editor.d.pub || '2026-11-27', titulo:S.editor.d.titulo || 'Nome da jornada'}); break;
    case 'aprovar': { const j = JORNADAS.find(x => x.id === Number(ds.j)); j.status = 'Publicada'; j.pub = j.pub || '2026-11-27'; log('Aprovação', `Jornada ${j.id} publicada (_ModerationStatus = 0)`); toast(`"${j.titulo}" publicada.`); render(); } break;
    case 'devolver': { const j = JORNADAS.find(x => x.id === Number(ds.j)); abrirSide(`Devolver: ${j.titulo}`, campo('dev', 'O que precisa ser ajustado *', '<textarea id="dev" maxlength="1000" placeholder="Seja específico: o comentário aparece para quem enviou."></textarea>'), `<button class="btn" data-act="fecharSide">Cancelar</button><button class="btn primary" data-act="confirmarDevolucao" data-j="${j.id}">Devolver</button>`); } break;
    case 'confirmarDevolucao': { const txt = $('#dev').value.trim(); if (!txt) { $('#dev').closest('.field').classList.add('invalid'); $('#dev').focus(); break; } const j = JORNADAS.find(x => x.id === Number(ds.j)); j.status = 'Devolvida'; j.devolucao = txt; fecharSide(); log('Aprovação', `Jornada ${j.id} devolvida`); toast('Jornada devolvida para ajustes.'); render(); } break;
    case 'ocultar': { const x = AVALIACOES[Number(ds.j)][Number(ds.ix)]; x.oculto = !x.oculto; log('Moderação', `Comentário ${x.oculto ? 'ocultado' : 'reexibido'}`); render(); } break;
    case 'removerMembro': { const [x] = PESSOAS_GRUPOS[ds.g].splice(Number(ds.ix), 1); toast(`${x.nome} removida do grupo.`); render(); } break;
    case 'lembrar': abrirSide('Lembrar atrasados', `<p class="small muted" style="margin-bottom:14px">Um e-mail por pessoa, enviado com a sua conta. Ninguém vê os outros destinatários.</p><div class="card panel" style="background:#f8fafc"><b style="color:var(--pi-navy)">Lembrete: jornada em atraso</b><p class="small" style="margin-top:8px">Olá, [nome]. A jornada <b>[jornada]</b> passou do prazo e ainda não foi concluída. Acesse a Jornada de Conhecimento para continuar de onde parou.</p></div>`, `<button class="btn" data-act="fecharSide">Cancelar</button><button class="btn primary" data-act="enviarLembretes">${ic('send', 16)}Enviar lembretes</button>`); break;
    case 'enviarLembretes': fecharSide(); log('Gestão', 'Lembretes enviados (SP.Utilities.Utility.SendEmail)'); toast('Lembretes enviados.'); break;
    case 'detalhe': { const m = MAPA[Number(ds.p)], j = JORNADAS.find(x => x.id === GESTAO_JORNADAS[Number(ds.k)]), c = m.cel[Number(ds.k)], n = Math.round(c / 100 * j.etapas.length);
      abrirSide(m.nome, `<p class="small muted" style="margin-bottom:6px">${esc(m.email)}</p><h3 style="font-size:16px;margin:14px 0 4px">${esc(j.titulo)}</h3><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><span class="bar"><i style="width:${c}%"></i></span><b class="small">${c}%</b>${c < 100 && atrasoDe(j) ? badge('Atrasada', 'red') : ''}</div><ol class="steps">${j.etapas.map((e, k) => `<li class="step ${k < n ? 'done' : k === n && c ? 'now' : ''}"><span class="n">${k < n ? ic('check', 14) : k + 1}</span><div class="txt"><b>${esc(e.t)}</b><span>${k < n ? `Concluída em ${18 + k}/11` : k === n && c ? 'Em andamento · 40% assistido' : 'Não iniciada'}</span></div></li>`).join('')}</ol>`, `<button class="btn" data-act="fecharSide">Fechar</button><button class="btn primary" data-act="enviarLembretes" ${c === 100 ? 'disabled' : ''}>${ic('mail', 16)}Lembrar esta pessoa</button>`); } break;
    case 'exportar': exportarCsv(); break;
    case 'copiarCsv': navigator.clipboard?.writeText(S.csv).then(() => toast('CSV copiado.')).catch(() => toast('Selecione o texto e copie com Ctrl+C.')); break;
    case 'novaArea': novaArea(); break;
    case 'criarArea': { const nome = $('#aN').value.trim(), sigla = $('#aS').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!nome) { $('#aN').closest('.field').classList.add('invalid'); $('#aN').focus(); break; } if (!/^[A-Z][A-Z0-9]{1,9}$/.test(sigla) || AREAS.some(a => a.sigla === sigla)) { const f = $('#aS').closest('.field'); f.classList.add('invalid'); f.querySelector('.hint').textContent = AREAS.some(a => a.sigla === sigla) ? 'Já existe uma área com esta sigla.' : 'Use de 2 a 10 letras ou números, começando por letra.'; $('#aS').focus(); break; }
      t.disabled = true; t.textContent = 'Criando…'; const area = {id:sigla, nome, sigla, cor:S.areaForm.cor, icone:'building', status:'Provisionando', gestores:S.areaForm.gestores.map(g => g.nome), usuarios:0, grupos:0};
      provisionar(area, () => { area.status = 'Ativa'; AREAS.push(area); fecharSide(); toast(`Área "${nome}" criada e ativa.`); render(); }); } break;
    case 'reprocessar': { const a = AREAS[Number(ds.a)]; abrirSide(`Reprocessar: ${a.nome}`, `<p class="small muted" style="margin-bottom:14px">Cada passo confere o que já existe: nada é duplicado.</p><ul class="checklist" id="provList">${['Grupos e proprietários', 'Listas e biblioteca', 'Permissões', 'Item da área'].map(x => `<li><span class="c">${ic('layers', 12)}</span>${x}</li>`).join('')}</ul>`, `<button class="btn" data-act="fecharSide">Fechar</button>`); provisionar(a, () => { a.status = 'Ativa'; delete a.erro; a.usuarios = 64; fecharSide(); toast(`Área "${a.nome}" reprocessada e ativa.`); render(); }); } break;
    case 'arquivar': { const a = AREAS[Number(ds.a)]; a.status = 'Arquivada'; toast(`"${a.nome}" arquivada. Dados e histórico preservados.`); render(); } break;
    case 'reativar': { AREAS[Number(ds.a)].status = 'Ativa'; render(); } break;
    case 'gestores': { const a = AREAS[Number(ds.a)]; abrirSide(`Gestores: ${a.nome}`, `${pessoasPicker('gk', [])}<div class="rows" style="margin-top:8px">${a.gestores.map(g => `<div class="row"><span class="avatar">${esc(g.split(' ').map(x => x[0]).join(''))}</span><div class="txt"><b>${esc(g)}</b><span>Grupo HML_Jornadas – ${esc(a.sigla)} – Gestores</span></div></div>`).join('')}</div>`, `<button class="btn" data-act="fecharSide">Fechar</button>`); } break;
  }
});

document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); abrirPaleta(); return; }
  if ($('#palette').open) { if (ev.key === 'ArrowDown') { ev.preventDefault(); S.palIx = Math.min(S.paleta.length - 1, S.palIx + 1); desenharPaleta(); } if (ev.key === 'ArrowUp') { ev.preventDefault(); S.palIx = Math.max(0, S.palIx - 1); desenharPaleta(); } if (ev.key === 'Enter') { ev.preventDefault(); irPaleta(S.palIx); } return; }
  const tag = (ev.target.tagName || '').toLowerCase(); if (['input', 'textarea', 'select'].includes(tag) || document.querySelector('dialog[open]')) return;
  if (S.rota.startsWith('player')) { if (ev.key === ' ' && $('#video') && !ev.target.closest('button,[role=slider]')) { ev.preventDefault(); tocar(); } if (ev.key.toLowerCase() === 'n') { const b = document.querySelector('.stage-foot [data-etapa-go]'); if (b && !b.disabled) b.click(); } }
});

$('#searchBtn').addEventListener('click', abrirPaleta);

$('#perfil').innerHTML = Object.entries(PERFIS).map(([k, p]) => `<option value="${k}">${esc(p.rotulo)}</option>`).join('');
$('#perfil').addEventListener('change', e => { pararVideo(); S.perfil = e.target.value; S.player = null; S.editor = null; log('Perfil', `Visualizando como ${perfil().rotulo}`); toast(`Perfil aplicado: ${perfil().rotulo}. Menus e ações ajustados.`); render(); });
document.querySelectorAll('dialog').forEach(d => d.addEventListener('close', () => { if (d.id === 'center') render(); }));
log('Perfil', 'Áreas visíveis: Institucional, Financeiro · papéis por permissão efetiva', 184);
render();
}
